services:
  # ----------------------------------------------------
  # Base de Datos Relacional PostgreSQL 16
  # ----------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: dashboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasks_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env de la raiz}
      POSTGRES_DB: ${POSTGRES_DB:-tasks_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dashboard_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasks_user} -d ${POSTGRES_DB:-tasks_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Backend API & Sincronizador (GLPI + ClickUp)
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashboard_backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-tasks_user}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env de la raiz}@db:5432/${POSTGRES_DB:-tasks_db}}
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrate_sqlite_to_pg.py:/app/migrate_sqlite_to_pg.py
      - dashboard_data:/app/
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dashboard_net

  # ----------------------------------------------------
  # Frontend Web Dashboard (Servido con Nginx + Proxy a la API)
  # ----------------------------------------------------
  frontend:
    image: nginx:alpine
    container_name: dashboard_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - dashboard_net

volumes:
  dashboard_data:
  postgres_data:

networks:
  dashboard_net:
    driver: bridge
