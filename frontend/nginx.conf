# ----------------------------------------------------------------------
# Zonas de rate limiting por IP (contexto http {} vía /etc/nginx/conf.d/)
# ----------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kiosk_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    client_max_body_size 50M;

    # Devolver HTTP 429 en lugar de 503 al superar rate limits
    limit_req_status 429;

    # Compresión GZIP de alta eficiencia para HTML, JS, JSON y CSS
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ------------------------------------------------------------------
    # Cabeceras de Seguridad Base HTTP-compatibles (nivel server)
    # Nota: No incluir upgrade-insecure-requests ni HSTS hasta Fase 3B (HTTPS)
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # Cabeceras de proxy unificadas heredadas por todos los locations de backend
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Respuesta JSON limpia en 429 compatible con el cliente SPA
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"detail":"Demasiadas solicitudes. Por favor intente nuevamente en unos momentos."}';
    }

    # Bloquear archivos ocultos y archivos no públicos dentro de /usr/share/nginx/html
    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~* ^/(nginx\.conf|test_deeplink\.js)$ {
        return 404;
    }

    # Frontend SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Deshabilitar caché de la SPA para reflejar cambios inmediatamente
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";

        # Replicación obligatoria en location con add_header propio (evita anular herencia de server {})
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
    }

    # Rutas sensibles protegidas con rate limit por IP
    location = /api/auth/login {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://backend:8000;
    }

    location = /api/auth/kiosk {
        limit_req zone=kiosk_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
    }

    location = /api/escalations/upload {
        limit_req zone=upload_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
    }

    # Visor PDF inline en navegador: permite el plugin PDF integrado del mismo origen
    location ~ ^/api/escalations/[0-9]+/view$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'self'; base-uri 'self'; frame-ancestors 'self';" always;
        proxy_pass http://backend:8000;
    }

    # API General
    location /api/ {
        proxy_pass http://backend:8000/api/;
    }
}
